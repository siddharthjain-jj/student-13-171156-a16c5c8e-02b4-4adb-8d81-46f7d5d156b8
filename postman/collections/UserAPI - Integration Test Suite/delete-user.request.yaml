$kind: http-request
name: Delete a user
method: DELETE
url: "{{baseUrl}}/v1/users/:id"
pathVariables:
  id: "{{id}}"
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
