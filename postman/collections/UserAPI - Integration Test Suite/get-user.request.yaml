$kind: http-request
name: Retrieve a user
method: GET
url: "{{baseUrl}}/v1/users/:id"
pathVariables:
  id: "{{id}}"
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
