$kind: http-request
name: Log in a user
method: POST
url: "{{baseUrl}}/v1/users/login"
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "username": "{{username}}",
        "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
